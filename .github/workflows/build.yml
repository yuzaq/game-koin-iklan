name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependensi sistem lengkap
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake autoconf-archive libtool libltdl-dev \
            build-essential libssl-dev libffi-dev zlib1g-dev \
            ccache lld cmake libsqlite3-dev

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.36
          pip install --upgrade buildozer

      - name: Build APK dengan Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
